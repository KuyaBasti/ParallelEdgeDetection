<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="1000" height="1120" role="img" aria-label="Parallel Edge Detection, three engines and one interface, as a class diagram. Image, the base class in image.hpp and image.cpp, is both the shared interface and the sequential engine. It declares eight virtual methods: convert, blur, gradient, edges and to_host are overridden by both subclasses, while shrink, write_png and clean are inherited unchanged. pixel, fppixel, validate, operator==, printdiff and the destructor are not virtual. ParallelImage (OpenMP and AVX, host memory) and CudaImage (CUDA, device memory) both inherit publicly from Image. Their no-argument overrides call mode overloads that the Image interface cannot see. ParallelImage uses convert mode 4, blur 4, gradient 3 and edges 2, and its to_host throws Need to implement. CudaImage always uses mode 0, and its to_host is the class's only device-to-host copy. In CudaImage only mode 0 launches a kernel. Other modes, other conversions and the inherited shrink, write_png, clean and pixel run host code on the device pointer.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1120" rx="12"/>
  <text class="title" x="32" y="48">Parallel Edge Detection — three engines, one interface</text>
  <text class="sub" x="32" y="74">Image declares the virtual pipeline and runs it sequentially; ParallelImage and CudaImage override it.</text>

  <!-- ================= Image: base class = interface + sequential engine ================= -->
  <!-- image.hpp:72-281, image.cpp -->
  <rect class="b-blue" x="150" y="100" width="700" height="354" rx="10"/>
  <text class="note" x="500" y="124" text-anchor="middle">«sequential baseline»</text>
  <text class="lbl mono" x="500" y="145" text-anchor="middle">Image</text>
  <text class="note" x="500" y="165" text-anchor="middle">image.hpp · image.cpp — the shared interface and the sequential engine in one class</text>
  <line class="b-blue" x1="150" y1="180" x2="850" y2="180"/>
  <line class="b-blue" x1="520" y1="180" x2="520" y2="454"/>

  <!-- left column: the 8 virtual methods (image.hpp:138-168) -->
  <text class="glbl" x="170" y="204">VIRTUAL · THE SHARED INTERFACE</text>
  <text class="note" x="170" y="226">overridden by both subclasses</text>
  <text class="note mono" x="170" y="246">convert(ImageType to)</text>
  <text class="note mono" x="170" y="264">blur()</text>
  <text class="note mono" x="170" y="282">gradient()</text>
  <text class="note mono" x="170" y="300">edges(float low, float high)</text>
  <text class="note mono" x="170" y="318">to_host()</text>
  <text class="note" x="300" y="318">returns shared_from_this()</text>
  <text class="note" x="170" y="352">inherited unchanged by both</text>
  <text class="note mono" x="170" y="372">shrink(uint factor)</text>
  <text class="note mono" x="170" y="390">write_png(filename)</text>
  <text class="note mono" x="170" y="408">clean()</text>
  <text class="note" x="300" y="408">clamps floats to [0, 1]</text>
  <text class="note" x="170" y="438">all but write_png and clean return shared_ptr&lt;Image&gt;</text>

  <!-- right column: non-virtual members, fields, base (image.hpp:72-280) -->
  <text class="glbl" x="540" y="204">NON-VIRTUAL</text>
  <text class="note mono" x="540" y="226">pixel(x, y, ch = 0) : unsigned char&amp;</text>
  <text class="note mono" x="540" y="244">fppixel(x, y, ch = 0) : float&amp;</text>
  <text class="note mono" x="540" y="262">validate() · operator== · printdiff()</text>
  <text class="note mono" x="540" y="280">~Image()</text>
  <text class="note" x="620" y="280">frees _data unless it is null</text>
  <text class="glbl" x="540" y="310">FIELDS · PROTECTED, EXCEPT _data</text>
  <text class="note mono" x="540" y="332">_x, _y : unsigned int</text>
  <text class="note mono" x="540" y="350">_type : ImageType</text>
  <text class="note mono" x="540" y="368">_data : void*</text>
  <text class="note" x="650" y="368">public · malloc or stbi_load</text>
  <text class="note mono" x="540" y="386">_isstb : bool</text>
  <text class="note" x="650" y="386">true when STB owns _data</text>
  <text class="glbl" x="540" y="416">BASE CLASS</text>
  <text class="note mono" x="540" y="438">std::enable_shared_from_this&lt;Image&gt;</text>

  <!-- ================= inheritance ================= -->
  <line class="edge" x1="256" y1="526" x2="256" y2="456" marker-end="url(#ah)"/>
  <line class="edge" x1="744" y1="526" x2="744" y2="456" marker-end="url(#ah)"/>
  <text class="elbl" x="246" y="486" text-anchor="end">public inheritance</text>
  <text class="elbl" x="246" y="502" text-anchor="end">overrides 5 of 8 virtuals</text>
  <text class="elbl" x="754" y="486">public inheritance</text>
  <text class="elbl" x="754" y="502">overrides 5 of 8 virtuals</text>
  <text class="note" x="500" y="484" text-anchor="middle">A shared_ptr&lt;Image&gt; cannot see the mode overloads,</text>
  <text class="note" x="500" y="502" text-anchor="middle">so each no-arg override decides which mode actually runs.</text>

  <!-- ================= ParallelImage ================= -->
  <!-- parallel_image.hpp:13-853, parallel_image.cpp -->
  <rect class="b-blue" x="24" y="526" width="464" height="538" rx="10"/>
  <text class="note" x="256" y="550" text-anchor="middle">«OpenMP + AVX intrinsics»</text>
  <text class="lbl mono" x="256" y="571" text-anchor="middle">ParallelImage</text>
  <text class="note" x="256" y="591" text-anchor="middle">parallel_image.hpp, all inline · to_host() in parallel_image.cpp</text>
  <text class="note" x="256" y="609" text-anchor="middle">host malloc · OpenMP threads · AVX __m256 = 8 floats</text>
  <line class="b-blue" x1="24" y1="624" x2="488" y2="624"/>

  <text class="glbl" x="40" y="646">CONSTRUCTION</text>
  <text class="note mono" x="40" y="668">ParallelImage(Image &amp;cp, int mode = 2)</text>
  <text class="note" x="336" y="668">copy-in, modes 0–2</text>
  <text class="note mono" x="40" y="686">ParallelImage(x, y, ImageType type)</text>
  <text class="note" x="336" y="686">host malloc, not zeroed</text>
  <text class="note mono" x="40" y="704">~ParallelImage()</text>
  <text class="note" x="336" y="704">implicit: ~Image frees</text>
  <line class="b-blue" x1="24" y1="720" x2="488" y2="720"/>

  <text class="glbl" x="40" y="742">OVERRIDES · NO-ARG CALL → DEFAULT MODE</text>
  <text class="note mono" x="40" y="764">convert(to)</text>
  <text class="note mono" x="200" y="764">→ convert(to, 4)</text>
  <text class="note mono" x="40" y="782">blur()</text>
  <text class="note mono" x="200" y="782">→ blur(4)</text>
  <text class="note mono" x="40" y="800">gradient()</text>
  <text class="note mono" x="200" y="800">→ gradient(3)</text>
  <text class="note mono" x="40" y="818">edges(low, high)</text>
  <text class="note mono" x="200" y="818">→ edges(low, high, 2)</text>
  <rect class="b-red" x="32" y="826" width="448" height="20" rx="4"/>
  <text class="note mono" x="40" y="840">to_host()</text>
  <text class="note" x="200" y="840">throws "Need to implement"</text>
  <text class="note" x="40" y="862">only needed if different_format() is true; it returns false</text>
  <line class="b-blue" x1="24" y1="878" x2="488" y2="878"/>

  <text class="glbl" x="40" y="900">MODE OVERLOADS · NOT ON THE IMAGE INTERFACE</text>
  <text class="note mono" x="40" y="922">convert(to, mode)</text>
  <text class="note" x="220" y="922">modes 0–5 · 0 = Image::convert · no AVX</text>
  <text class="note mono" x="40" y="940">blur(mode)</text>
  <text class="note" x="220" y="940">modes 0–4 · 4 = AVX</text>
  <text class="note mono" x="40" y="958">gradient(mode)</text>
  <text class="note" x="220" y="958">modes 0–3 · 3 = AVX</text>
  <text class="note mono" x="40" y="976">edges(low, high, mode)</text>
  <text class="note" x="220" y="976">modes 0–2 · no AVX</text>
  <text class="note" x="40" y="998">other conversions → Image::convert, copied into a new ParallelImage</text>
  <text class="note" x="40" y="1022">blur / gradient / edges(mode) return shared_ptr&lt;ParallelImage&gt;</text>
  <text class="note" x="40" y="1046">AVX modes vectorize the interior; a scalar pass clamps the border</text>

  <!-- ================= CudaImage ================= -->
  <!-- cuda_image.hpp:7-34, cuda_image.cu -->
  <rect class="b-purple" x="512" y="526" width="464" height="538" rx="10"/>
  <text class="note" x="744" y="550" text-anchor="middle">«CUDA kernels, device-resident»</text>
  <text class="lbl mono" x="744" y="571" text-anchor="middle">CudaImage</text>
  <text class="note" x="744" y="591" text-anchor="middle">cuda_image.hpp · cuda_image.cu · 5 kernels</text>
  <text class="note" x="744" y="609" text-anchor="middle">inherited _data holds a cudaMalloc pointer · 32×32 thread blocks</text>
  <line class="b-purple" x1="512" y1="624" x2="976" y2="624"/>

  <text class="glbl" x="528" y="646">CONSTRUCTION</text>
  <text class="note mono" x="528" y="668">CudaImage(Image &amp;from)</text>
  <text class="note" x="770" y="668">cudaMalloc + copy H2D</text>
  <text class="note mono" x="528" y="686">CudaImage(x, y, ImageType type)</text>
  <text class="note" x="770" y="686">cudaMalloc + cudaMemset 0</text>
  <text class="note mono" x="528" y="704">~CudaImage()</text>
  <text class="note" x="770" y="704">cudaFree, then _data = nullptr</text>
  <line class="b-purple" x1="512" y1="720" x2="976" y2="720"/>

  <text class="glbl" x="528" y="742">OVERRIDES · NO-ARG CALL → MODE 0</text>
  <text class="note mono" x="528" y="764">convert(to)</text>
  <text class="note mono" x="688" y="764">→ convert(to, 0)</text>
  <text class="note mono" x="528" y="782">blur()</text>
  <text class="note mono" x="688" y="782">→ blur(0)</text>
  <text class="note mono" x="528" y="800">gradient()</text>
  <text class="note mono" x="688" y="800">→ gradient(0)</text>
  <text class="note mono" x="528" y="818">edges(low, high)</text>
  <text class="note mono" x="688" y="818">→ edges(low, high, 0)</text>
  <text class="note mono" x="528" y="840">to_host()</text>
  <text class="note" x="688" y="840">cudaMemcpy D2H into a new Image</text>
  <text class="note" x="528" y="862">the only device-to-host copy anywhere in CudaImage</text>
  <line class="b-purple" x1="512" y1="878" x2="976" y2="878"/>

  <text class="glbl" x="528" y="900">MODE OVERLOADS · NOT ON THE IMAGE INTERFACE</text>
  <text class="note mono" x="528" y="922">convert(to, mode)</text>
  <text class="note" x="708" y="922">mode 0: 2 conversion kernels</text>
  <text class="note mono" x="528" y="940">blur(mode)</text>
  <text class="note" x="708" y="940">mode 0: blur_kernel</text>
  <text class="note mono" x="528" y="958">gradient(mode)</text>
  <text class="note" x="708" y="958">mode 0: gradient_kernel</text>
  <text class="note mono" x="528" y="976">edges(low, high, mode)</text>
  <text class="note" x="708" y="976">mode 0: edges_kernel</text>
  <text class="note" x="528" y="998">all return shared_ptr&lt;Image&gt;; mode 0 returns a new CudaImage</text>
  <rect class="b-red" x="520" y="1008" width="448" height="20" rx="4"/>
  <text class="note" x="528" y="1022">other modes or conversions → Image::*, host code on device _data</text>
  <rect class="b-red" x="520" y="1032" width="448" height="20" rx="4"/>
  <text class="note" x="528" y="1046">inherited shrink, write_png, clean, pixel() also read _data on the host</text>

  <!-- ================= legend ================= -->
  <rect class="b-blue" x="40" y="1084" width="26" height="14" rx="4"/>
  <text class="note" x="76" y="1095">host CPU, host memory</text>
  <rect class="b-purple" x="248" y="1084" width="26" height="14" rx="4"/>
  <text class="note" x="284" y="1095">NVIDIA GPU, device memory</text>
  <rect class="b-red" x="480" y="1084" width="26" height="14" rx="4"/>
  <text class="note" x="516" y="1095">throws, or host code on device memory</text>
  <line class="edge" x1="770" y1="1091" x2="808" y2="1091" marker-end="url(#ah)"/>
  <text class="note" x="818" y="1095">subclass → base class</text>
</svg>
